<!-- Sin width/height: solo viewBox, para que escale al tamano que pida cada
     consumidor (pestana del navegador, icono de iOS, rasterizado a PNG). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#0f172a" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="3" />

  <!-- Simbolo de terminal: chevron y cursor. Trazos gruesos y sin detalle fino
       para que siga siendo legible a 16 px. -->
  <polyline
    points="17,21 31,32 17,43"
    fill="none"
    stroke="url(#accent)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="34" y="38" width="16" height="6" rx="3" fill="url(#accent)" />
</svg>
