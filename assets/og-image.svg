    </text>

    <text x="90" y="382" font-size="40" font-weight="300" fill="#93c5fd">
      React · .NET · C# · TypeScript
    </text>

    <text x="90" y="452" font-size="26" font-weight="300" fill="#94a3b8">
      Aplicaciones web de principio a fin, de la interfaz a la base de datos.
    </text>

    <text x="90" y="556" font-size="26" font-weight="600" fill="#e2e8f0">
