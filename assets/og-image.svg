  <!-- Mismo simbolo de terminal que el favicon, para que la marca sea una sola. -->
  <g transform="translate(958, 232)">
    <rect x="0" y="0" width="152" height="152" rx="34" fill="#0b1220" stroke="url(#accent)" stroke-width="3" />
    <polyline
